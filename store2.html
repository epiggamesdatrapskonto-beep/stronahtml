<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Come back later</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        /* Nagłówek MW label - standardowy szeryfowy, wymuszone małe litery */
        h1 {
            font-size: 3.5rem;
            font-weight: normal;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: lowercase;
        }

        /* Link Home */
        .nav-link {
            display: inline-block;
            color: #ffffff;
            text-decoration: underline;
            font-size: 1rem;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        /* Grafika ptaka */
        .character-img {
            max-width: 320px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 30px auto;
        }

        /* Napis come back later */
        .status-text {
            font-size: 2.5rem;
            font-weight: normal;
        }

        /* Responsywność */
        @media (max-width: 480px) {
            h1 { font-size: 2.5rem; }
            .character-img { max-width: 240px; }
            .status-text { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1></h1>
        <a href="index.html" class="nav-link">Home</a>
        
        <img src="asdasdasdasdasdasdasdasd.png" alt="MW Character" class="character-img">
        
        <p class="status-text">come back later</p>
    </div>

</body>
</html>
