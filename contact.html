<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW LABEL - Contact</title>
    <style>
        /* Reset styli */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Nagłówek MW LABEL */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #555555; /* Mroczny, ciemnoszary kolor */
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.05);
            user-select: none;
        }

        /* Kontener formularza */
        .contact-container {
            width: 100%;
            max-width: 500px;
            background-color: #050505; /* Delikatnie jaśniejsza czerń dla odcięcia */
            border: 1px solid #1a1a1a; /* Bardzo ciemna ramka */
            padding: 40px 30px;
            border-radius: 4px;
            box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.7);
        }

        /* Pojedyncze pole formularza */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888888;
            margin-bottom: 8px;
        }

        /* Style dla inputów i textarea */
        .form-group input, 
        .form-group textarea {
            width: 100%;
            background-color: #000000;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 2px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Efekt po kliknięciu w pole (focus) */
        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0px 0px 8px rgba(255, 255, 255, 0.2);
        }

        /* Blokada rozciągania textarea na boki */
        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        /* Przycisk Wyślij */
        .submit-btn {
            width: 100%;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 15px;
            font-family: inherit;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MW LABEL</div>
        <br>
        <h5>nie działa może tak za tydzień będzie</h5>
        <br>
        <h6>jebać shella</h6>
    </header>

    <div class="contact-container">
        
        <form action="https://formsubmit.co/revili9716@hidevak.com" method="POST">
            
            <input type="text" name="_honey" style="display:none">
            <input type="hidden" name="_captcha" value="false">

            <div class="form-group">
                <label for="name">Imię</label>
                <input type="text" id="name" name="Imię" placeholder="Twoje imię..." required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="E-mail" placeholder="Twój adres e-mail..." required>
            </div>

            <div class="form-group">
                <label for="message">Twoje Pytanie</label>
                <textarea id="message" name="Treść pytania" placeholder="Wpisz swoje pytanie tutaj..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Wyślij Wiadomość</button>

        </form>
    </div>

</body>
</html>
